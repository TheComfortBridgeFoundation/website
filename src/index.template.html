<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospice, Explained</title>
<meta name="description" content="A plain-language guide to hospice care in English, Spanish, Vietnamese and Chinese, with Bay Area and California resources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E3336;--ink-soft:#4A5F61;--paper:#F6F7F4;--surface:#FFFFFF;--sage:#DCE6DF;--sage-deep:#4F6E5F;
  --dusk:#6E5A8A;--dusk-wash:#ECE6F3;--line:#CBD6CF;--lamp:#E7B95A;--focus:#6E5A8A;
  --body-font:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --head-font:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E6EEEA;--ink-soft:#A9BAB3;--paper:#141C1D;--surface:#1B2527;--sage:#223230;--sage-deep:#8FB3A1;--dusk:#C3B0E0;--dusk-wash:#2A2436;--line:#2F3F3D;--focus:#C3B0E0}}
:root[data-theme="dark"]{--ink:#E6EEEA;--ink-soft:#A9BAB3;--paper:#141C1D;--surface:#1B2527;--sage:#223230;--sage-deep:#8FB3A1;--dusk:#C3B0E0;--dusk-wash:#2A2436;--line:#2F3F3D;--focus:#C3B0E0}
:root:lang(vi){--body-font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
:root:lang(zh-Hant){--body-font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;--head-font:"PingFang TC","Microsoft JhengHei","Noto Serif TC","Songti TC",serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body-font);font-size:1.1875rem;line-height:1.6;-webkit-font-smoothing:antialiased}
:lang(zh-Hant) body{line-height:1.8}
a{color:var(--dusk);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--head-font);font-weight:500;line-height:1.18;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5.6vw,4rem);font-weight:400}
h2{font-size:clamp(1.8rem,3.5vw,2.55rem)}
h3{font-size:1.38rem;font-weight:600}
p{margin:0 0 1em;max-width:66ch}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2.5rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:50}
.skip:focus{left:1rem;top:calc(env(safe-area-inset-top,0px) + .5rem)}

header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:1rem;min-height:66px}
.brand{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.6rem;margin-right:auto;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
#brandName{font-family:"Newsreader",Georgia,serif;font-size:1.35rem;font-weight:600}
.brand-sub{font-size:.78rem;color:var(--ink-soft);margin-top:.15rem}
nav.primary a[aria-current="page"]{color:var(--dusk);text-decoration:underline;text-decoration-thickness:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;font-weight:700;font-size:1rem;padding:.7rem 1.25rem;border-radius:999px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);line-height:1.2}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn-solid:hover{background:var(--dusk);border-color:var(--dusk)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.head-cta{font-size:.92rem;padding:.5rem 1rem;flex:none}
@media (max-width:620px){.head-cta{display:none}}
nav.primary ul{list-style:none;margin:0;padding:0;display:flex;gap:1.1rem;font-size:.98rem}
nav.primary a{color:var(--ink);text-decoration:none;white-space:nowrap}
nav.primary a:hover{color:var(--dusk);text-decoration:underline}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{font:inherit;font-family:system-ui,sans-serif;font-size:.88rem;background:none;border:0;color:var(--ink);padding:.38rem .7rem;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.95rem;padding:.38rem .8rem;border-radius:999px;cursor:pointer;flex:none}
@media (max-width:1260px){
  .menu-btn{display:block}
  nav.primary{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line)}
  nav.primary.open{display:block}
  nav.primary ul{flex-direction:column;gap:0;padding:.4rem clamp(1.1rem,4vw,2.5rem) 1rem}
  nav.primary a{display:block;padding:.6rem 0;border-bottom:1px solid var(--line)}
}
@media (max-width:620px){
  .bar{flex-wrap:wrap;padding:.5rem 0;gap:.5rem}
  .langs{order:3;width:100%;justify-content:space-between}
  .langs button{flex:1}
}

.mt-note{background:var(--dusk-wash);border-bottom:1px solid var(--line);font-size:.95rem}
.mt-note .wrap{padding-top:.6rem;padding-bottom:.6rem}
.mt-note p{margin:0;max-width:none}

.hero{padding:clamp(3rem,8vw,6rem) 0 clamp(2.5rem,6vw,4rem);position:relative;overflow:hidden}
.hero .horizon{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(180deg,transparent,var(--sage));pointer-events:none}
.hero .sun{position:absolute;right:clamp(-120px,-4vw,-40px);top:clamp(30px,6vw,70px);width:clamp(220px,34vw,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lamp) 55%,transparent),transparent 68%);pointer-events:none}
.hero .wrap{position:relative}
.hero h1{max-width:16ch;margin-bottom:.4em}
.lede{font-size:clamp(1.2rem,2vw,1.4rem);color:var(--ink-soft);max-width:46ch}
.paths{margin-top:2.5rem;max-width:820px}
.paths p.ask{font-family:var(--head-font);font-size:1.45rem;margin-bottom:.8rem}
.path-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:.6rem}
.path-list a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.15rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:700;line-height:1.3}
.path-list a span.sub{display:block;font-weight:400;font-size:.95rem;color:var(--ink-soft);margin-top:.2rem}
.path-list a:hover{border-color:var(--dusk);background:var(--dusk-wash)}
.path-list svg{flex:none;color:var(--dusk)}

section.block{padding:clamp(3rem,7vw,5.5rem) 0;border-top:1px solid var(--line)}
section.tint{background:var(--sage)}
.intro{max-width:68ch;margin-bottom:2rem}
.intro p{color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3.5rem)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,2.5vw,2rem)}
@media (max-width:900px){.three{grid-template-columns:1fr}}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.5rem}
.panel>:last-child{margin-bottom:0}
ul.plain{padding-left:1.2rem;margin:0 0 1em}
ul.plain li{margin:.35rem 0}
.note{border-left:4px solid var(--lamp);padding:.8rem 1.1rem;background:var(--surface);border-radius:0 12px 12px 0;max-width:70ch}
.note p:last-child{margin:0}
.small{font-size:1rem;color:var(--ink-soft)}

.myths{display:grid;gap:.6rem;max-width:880px}
details.myth{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.myth summary{cursor:pointer;list-style:none;padding:1.05rem 1.25rem;display:flex;gap:1rem;align-items:flex-start;font-family:var(--head-font);font-size:1.28rem;line-height:1.3}
details.myth summary::-webkit-details-marker{display:none}
.tag{flex:none;font-family:var(--body-font);font-size:.82rem;background:var(--dusk-wash);color:var(--dusk);padding:.15rem .6rem;border-radius:999px;margin-top:.25rem}
.chev{margin-left:auto;flex:none;transition:transform .2s ease;margin-top:.35rem}
details.myth[open] .chev{transform:rotate(180deg)}
details.myth .fact{padding:0 1.25rem 1.1rem}
details.myth .fact strong{color:var(--sage-deep)}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:1.02rem}
th,td{text-align:left;vertical-align:top;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
thead th{font-family:var(--head-font);font-size:1.2rem;font-weight:600;background:var(--dusk-wash)}
tbody th{font-weight:700;width:24%}
tr:last-child th,tr:last-child td{border-bottom:none}

/* conditions */
.cond{display:grid;grid-template-columns:260px 1fr;gap:clamp(1rem,3vw,2.5rem);align-items:start}
@media (max-width:820px){.cond{grid-template-columns:1fr}}
.cond-tabs{display:flex;flex-direction:column;gap:.35rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
@media (max-width:820px){.cond-tabs{position:static;flex-direction:row;flex-wrap:wrap}}
.cond-tabs button{font:inherit;font-size:1.02rem;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:.6rem .9rem;color:var(--ink);cursor:pointer}
@media (max-width:820px){.cond-tabs button{border-color:var(--line);background:var(--surface);border-radius:999px;padding:.4rem .9rem;font-size:.95rem}}
.cond-tabs button:hover{background:var(--surface)}
.cond-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cond-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(1.3rem,3vw,2.2rem)}
.cond-panel .intro-p{font-size:1.15rem}
.cond-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:1.2rem 0}
@media (max-width:620px){.cond-cols{grid-template-columns:1fr}}
.cond-cols h3{font-size:1.15rem}

.periods{display:flex;gap:.4rem;margin:1.2rem 0 .6rem;flex-wrap:wrap}
.period{padding:.7rem .9rem;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.98rem;line-height:1.3}
.period b{display:block;font-family:var(--head-font);font-size:1.25rem;font-weight:600}
.period.p90{flex:3 1 150px}.period.p60{flex:2 1 110px}.period.more{flex:1 1 90px;border-style:dashed;color:var(--ink-soft)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.levels div{background:var(--surface);padding:1.2rem 1.25rem}
.levels h3{font-size:1.18rem}
.levels p{font-size:1rem;margin:0;color:var(--ink-soft)}

.checklist{list-style:none;padding:0;margin:0;display:grid;gap:.45rem;max-width:840px}
.checklist label{display:flex;gap:.8rem;align-items:flex-start;padding:.75rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.checklist input{width:1.25rem;height:1.25rem;margin-top:.25rem;accent-color:var(--dusk);flex:none}
.checklist input:checked + span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{font-size:1rem;color:var(--ink-soft);margin:.8rem 0 0}

/* local */
.local-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.3rem}
.local-card h4{font-family:var(--body-font);font-size:1.08rem;margin:0}
.local-card p{font-size:.98rem;color:var(--ink-soft);margin:0}
.local-card .ph{font-weight:700;color:var(--ink);text-decoration:none}
.stack{display:grid;gap:.7rem}
.col-h{font-size:1.3rem;margin-bottom:.8rem}
.lang-pills{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.lang-pills span{font-size:.8rem;padding:.08rem .5rem;border-radius:999px;background:var(--dusk-wash);color:var(--dusk)}

/* directory */
.dir-tools{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-bottom:1rem}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:.75rem 1rem .75rem 2.6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{font:inherit;font-size:.93rem;padding:.42rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:.5rem;font-size:1rem;margin:0 0 1rem}
.toggle input{width:1.15rem;height:1.15rem;accent-color:var(--dusk)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:.8rem}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.35rem}
.res h3{font-family:var(--body-font);font-size:1.06rem;font-weight:700;margin:0}
.res h3 a{color:var(--ink);text-decoration:none}
.res h3 a:hover{color:var(--dusk);text-decoration:underline}
.res p{font-size:.97rem;color:var(--ink-soft);margin:0}
.res .meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:auto;padding-top:.5rem}
.res .meta span{font-size:.8rem;padding:.1rem .55rem;border-radius:999px;background:var(--sage);color:var(--ink)}
.res .meta span.who{background:var(--dusk-wash);color:var(--dusk)}
.empty{padding:2rem;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--ink-soft)}
.count{font-size:.95rem;color:var(--ink-soft);margin:0 0 .8rem}

.help{background:var(--ink);color:var(--paper)}
.help h2{color:var(--paper)}
.help a{color:var(--lamp)}
.help .lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1.4rem;margin-top:1.4rem}
.help .lines div{border-top:1px solid color-mix(in srgb,var(--paper) 30%,transparent);padding-top:.9rem}
.help .num{font-family:var(--head-font);font-size:1.6rem;display:block}
.help p{color:color-mix(in srgb,var(--paper) 80%,transparent);font-size:1rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .help{background:#0E1415;color:var(--ink)}:root:not([data-theme="light"]) .help h2{color:var(--ink)}:root:not([data-theme="light"]) .help p{color:var(--ink-soft)}}
:root[data-theme="dark"] .help{background:#0E1415;color:var(--ink)}
footer.site-foot{padding:3rem 0 3rem;font-size:.97rem;color:var(--ink-soft);border-top:1px solid var(--line)}
footer.site-foot p{max-width:80ch}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:2rem;margin-bottom:2rem}
@media (max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.foot-grid{grid-template-columns:1fr}}
.foot-grid h4{font-family:var(--body-font);color:var(--ink);font-size:1rem;margin:0 0 .6rem}
.foot-grid ul{list-style:none;padding:0;margin:0}.foot-grid li{margin:.35rem 0}
.foot-grid a{color:var(--ink-soft)}.foot-grid a:hover{color:var(--dusk)}
.foot-brand{font-family:"Newsreader",Georgia,serif;font-size:1.3rem;color:var(--ink);margin-bottom:.4rem}
.fine{border-top:1px solid var(--line);padding-top:1.4rem;font-size:.92rem}

/* hero additions */
.hero-ctas{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.6rem 0 0}
.facts{display:flex;flex-wrap:wrap;gap:clamp(1.2rem,4vw,3rem);margin-top:2.2rem;padding-top:1.4rem;border-top:1px solid var(--line);max-width:820px}
.facts div{display:flex;align-items:baseline;gap:.6rem;max-width:15rem}
.facts b{font-family:var(--head-font);font-size:2.6rem;font-weight:500;line-height:1}
.facts span{font-size:.97rem;color:var(--ink-soft);line-height:1.35}

/* pillars */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.8rem}
@media (max-width:980px){.pillars{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem 1.3rem 1.4rem;border-top:5px solid var(--sage-deep)}
.pillar:nth-child(2){border-top-color:var(--dusk)}.pillar:nth-child(3){border-top-color:var(--lamp)}.pillar:nth-child(4){border-top-color:var(--ink)}
.pillar h3{font-size:1.25rem}.pillar p{font-size:1rem;color:var(--ink-soft);margin:0}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1rem}
.flip{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;perspective:1400px;font:inherit;color:inherit;border-radius:18px}
.flip .inner{display:grid;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;padding:1.4rem;min-height:230px;display:flex;flex-direction:column;gap:.7rem;border:1px solid var(--line)}
.face.front{background:var(--surface)}
.face.back{background:var(--ink);color:var(--paper);transform:rotateY(180deg);border-color:var(--ink)}
.face .q{font-family:var(--head-font);font-size:1.35rem;line-height:1.3}
.face .a{font-size:1rem;line-height:1.55}
.face .hint{margin-top:auto;font-size:.88rem;color:var(--ink-soft)}
.face.back .hint{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.face.back .tag{background:var(--lamp);color:#1E3336}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .face.back{background:#0E1415;color:var(--ink)}}

/* pages */
.page-head{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(2rem,4vw,3rem);background:linear-gradient(180deg,var(--paper),var(--sage))}
.crumbs{font-size:.95rem;color:var(--ink-soft);margin-bottom:1rem}
.crumbs a{color:var(--ink-soft)}
.page-head h1{font-size:clamp(2.1rem,5vw,3.4rem);max-width:22ch}
.badge{display:inline-block;font-size:.9rem;font-weight:700;padding:.25rem .8rem;border-radius:999px;background:var(--dusk-wash);color:var(--dusk);margin-bottom:1rem}
.statement{font-family:var(--head-font);font-size:clamp(1.5rem,3vw,2.15rem);line-height:1.35;max-width:32ch;margin:0}
.statements{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,4rem)}
@media (max-width:820px){.statements{grid-template-columns:1fr}}
.statements .lbl{font-size:1rem;font-weight:700;color:var(--sage-deep);margin-bottom:.6rem;display:block}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vals div{background:var(--surface);padding:1.2rem}
.vals h3{font-size:1.12rem}.vals p{font-size:.97rem;color:var(--ink-soft);margin:0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:1rem 0;font-weight:700;list-style:none;display:flex;gap:1rem}
.faq summary::-webkit-details-marker{display:none}
.faq details[open] .chev{transform:rotate(180deg)}
.faq details p{padding:0 0 1rem;margin:0;color:var(--ink-soft)}
.cta-band{background:var(--ink);color:var(--paper);border-radius:24px;padding:clamp(1.6rem,4vw,2.8rem);display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center;justify-content:space-between}
.cta-band h2{color:var(--paper);margin-bottom:.3rem}.cta-band p{margin:0;color:color-mix(in srgb,var(--paper) 80%,transparent)}
.cta-band .btn{border-color:var(--paper)}
.cta-band .btn-solid{background:var(--lamp);color:#1E3336;border-color:var(--lamp)}
.cta-band .btn-ghost{color:var(--paper)}
.cta-band .btn-ghost:hover{background:color-mix(in srgb,var(--paper) 12%,transparent)}

/* chapter directory */
.ch-tools{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.2rem}
.ch-tools select{font:inherit;font-size:1rem;padding:.7rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ch-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1rem}
.ch-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.4rem;display:flex;flex-direction:column;gap:.5rem}
.ch-card h3{margin:0}
.ch-card .where{color:var(--ink-soft);font-size:1rem}
.ch-card .btn{align-self:flex-start;margin-top:.6rem}
.status{align-self:flex-start;font-size:.82rem;font-weight:700;padding:.15rem .65rem;border-radius:999px;background:color-mix(in srgb,var(--lamp) 35%,transparent);color:var(--ink)}
.status.active{background:var(--sage);color:var(--sage-deep)}

/* form */
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(1.3rem,3vw,2rem)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:.35rem}
.field.full{grid-column:1/-1}
.field label{font-weight:700;font-size:.98rem}
.field label small{font-weight:400;color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;padding:.7rem .85rem;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.field textarea{min-height:110px;resize:vertical}
.field [aria-invalid="true"]{border-color:#B4443A}
.form-msg{margin:1rem 0 0;font-size:1rem}
.form-msg.err{color:#B4443A}
.form-closed{background:var(--dusk-wash);border-radius:12px;padding:.8rem 1rem;font-size:.98rem;margin:0 0 1.2rem}
.do-list{display:grid;gap:1rem;margin:1.5rem 0}
.do-list div{display:flex;gap:.9rem;align-items:flex-start}
.do-list .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--lamp);margin-top:.55rem}
.do-list h3{font-size:1.1rem;margin:0 0 .15rem}.do-list p{margin:0;font-size:1rem;color:var(--ink-soft)}

/* tri-valley */
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media (max-width:900px){.cities{grid-template-columns:1fr}}
.city h3{font-size:1.5rem;padding-bottom:.5rem;border-bottom:2px solid var(--lamp);margin-bottom:.9rem}
.empty-events{border:1.5px dashed var(--line);border-radius:18px;padding:1.6rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.empty-events p{margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1rem}
.roles div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem}
.roles h3{font-size:1.12rem}.roles p{margin:0;font-size:.98rem;color:var(--ink-soft)}
th.hl,td.hl{background:color-mix(in srgb,var(--sage) 55%,var(--surface))}
thead th.hl{background:var(--sage)}
.gap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:center}
@media (max-width:820px){.gap{grid-template-columns:1fr}}
.gap-big{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:.6rem 0 1.2rem}
.gap-big b{font-family:var(--head-font);font-size:clamp(4rem,10vw,6.5rem);font-weight:500;line-height:.9;color:var(--sage-deep)}
.gap-big span{font-size:1.15rem;max-width:20ch;line-height:1.35}
.bars{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.5rem}
.bars figcaption{font-weight:700;margin-bottom:1rem}
.gbar{display:grid;grid-template-columns:minmax(8rem,10rem) 1fr 3.5rem;gap:.8rem;align-items:center;margin:.55rem 0;font-size:1rem}
@media (max-width:480px){.gbar{grid-template-columns:1fr 3.2rem}.gbar .bl{grid-column:1/-1}}
.track{height:14px;background:var(--sage);border-radius:999px;overflow:hidden}
.fill{display:block;height:100%;background:var(--sage-deep);border-radius:999px}
.gbar:first-of-type .fill{background:var(--ink-soft)}
.bv{font-weight:700;text-align:right}
.quiz{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1rem;counter-reset:q}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem 1.4rem;counter-increment:q}
.qcard fieldset{border:0;margin:0;padding:0;min-width:0}
.qcard legend{font-family:var(--head-font);font-size:1.25rem;line-height:1.3;margin-bottom:.9rem;padding:0}
.qcard legend::before{content:counter(q) ". ";color:var(--dusk)}
.opts{display:grid;gap:.4rem}
.opt{font:inherit;font-size:1rem;text-align:left;padding:.6rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--dusk)}
.opt.ok{border-color:var(--sage-deep);background:var(--sage);font-weight:700}
.opt.ok::after{content:" ✓"}
.opt.no{border-color:#B4443A;background:color-mix(in srgb,#B4443A 10%,var(--surface))}
.qfb{font-size:.98rem;margin:.8rem 0 0}
.qfb:empty{display:none}
.qscore{display:flex;align-items:center;gap:1rem;margin-top:1.2rem}
.qscore p{margin:0;font-weight:700;font-size:1.1rem}
.timeline{list-style:none;padding:0;margin:0;position:relative;max-width:820px}
.timeline::before{content:"";position:absolute;left:7.5rem;top:.5rem;bottom:.5rem;width:2px;background:var(--line)}
.timeline li{display:grid;grid-template-columns:7.5rem 1fr;gap:1.6rem;padding:0 0 1.6rem;position:relative}
.timeline li::before{content:"";position:absolute;left:calc(7.5rem - 6px);top:.45rem;width:14px;height:14px;border-radius:50%;background:var(--lamp);border:3px solid var(--paper)}
.timeline .yr{font-family:var(--head-font);font-size:1.3rem;font-weight:600;text-align:right;padding-right:.6rem;line-height:1.3}
.timeline h3{font-size:1.2rem;margin-bottom:.25rem}.timeline p{margin:0;color:var(--ink-soft)}
@media (max-width:560px){.timeline::before{left:.4rem}.timeline li{grid-template-columns:1fr;gap:.2rem;padding-left:1.8rem}.timeline li::before{left:-.05rem}.timeline .yr{text-align:left}}
.talk{display:flex;gap:1rem;align-items:flex-start;margin-top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem 1.4rem}
.talk-ico{flex:none;width:48px;height:48px;border-radius:12px;background:var(--dusk-wash);color:var(--dusk);display:grid;place-items:center}
.talk h3{font-size:1.2rem;margin-bottom:.2rem}.talk p.talk-by{font-weight:700;color:var(--dusk);margin-bottom:.4rem;font-size:.97rem}.talk p{margin:0;color:var(--ink-soft)}

.member{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center;max-width:1000px}
@media (max-width:720px){.member{grid-template-columns:1fr}.member .door{max-width:260px}}
.door{aspect-ratio:3/4;border-radius:999px 999px 20px 20px;overflow:hidden;background:linear-gradient(160deg,var(--sage),var(--dusk-wash));border:1px solid var(--line);display:grid;place-items:center}
.door img{width:100%;height:100%;object-fit:cover;display:block}
.door .ini{font-family:var(--head-font);font-size:4rem;color:var(--sage-deep)}
.m-role{font-weight:700;color:var(--dusk);margin:0 0 .2rem}
.m-name{font-size:clamp(1.8rem,3.5vw,2.4rem);font-weight:500;margin-bottom:.8rem}
.m-bio{font-size:1.12rem;line-height:1.7;max-width:62ch}
</style>
</head>
